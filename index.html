<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Practice</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:820px;margin:auto;padding:24px;line-height:1.6;color:#222}h1{line-height:1.2}button{font:inherit;cursor:pointer;padding:9px 14px;margin:6px 6px 6px 0;border:1px solid #aaa;border-radius:6px;background:#f7f7f7}button:hover:not(:disabled){background:#eee}.story-button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;font-size:1.1rem}.hidden{display:none}.instructions{color:#555}.question{margin:24px 0 30px;padding-bottom:20px;border-bottom:1px solid #ddd}.sentence{font-size:1.2rem;margin-bottom:10px}.choice{min-width:95px}.choice:disabled{cursor:default;opacity:1}.correct{background:#d8f3dc;border-color:#6a9f75}.incorrect{background:#ffd6d6;border-color:#c77}#score{font-size:1.5rem;font-weight:700;margin:24px 0}#scoreButton{font-weight:600;margin-top:20px}.top-button{margin-bottom:18px}
</style></head><body>
<section id="select"><h1>Reading Practice</h1><p class="instructions">Choose a story to read. Then choose the word that makes sense in each sentence.</p><div id="stories"></div></section>
<section id="practice" class="hidden"><button id="back">← Choose a Different Story</button><h1 id="title"></h1><p id="progress"></p><div id="questions"></div><div id="scoreArea"></div></section>
<section id="results" class="hidden"><h1>Great Job!</h1><div id="score"></div><button id="again">Choose Another Story</button></section>
<script>
const S=[
["The Lost Kite",[
"Mia took her red kite to the [park,kitchen,pillow].","The wind was [strong,sleepy,square] that afternoon.","Mia ran across the grass and held the string [tightly,quietly,yesterday].","Soon the kite flew high above the [trees,spoons,shoes].","Mia smiled when the kite danced in the [sky,bowl,drawer].","Then a big gust pulled the kite from her [hands,sandwich,backpack].","The kite floated toward a tall [tree,bathtub,cookie].","Mia asked her dad to help her get it [down,purple,breakfast].","Dad used a long stick to free the string from a [branch,shoe,spoon].","Mia thanked her dad and flew her kite [again,hungry,wooden]."]],
["A Rainy Day Adventure",[
"Rain tapped softly on the [window,sandwich,bicycle].","Leo put on his yellow [boots,pillow,pencil].","He opened his umbrella before walking [outside,banana,Tuesday].","A small puddle formed near the [sidewalk,ceiling,backpack].","Leo jumped over it with a big [splash,whisper,sandwich].","He saw a tiny frog sitting beside a [rock,blanket,spoon].","The frog quickly hopped into the [grass,closet,cookie].","Leo followed it until he reached a little [pond,pencil,bedroom].","After the rain stopped, a bright [rainbow,shoe,table] appeared.","Leo walked home feeling happy about his rainy day [adventure,carrot,pillow]."]],
["The Garden Surprise",[
"Nora planted a tiny [seed,sock,spoon] in her garden.","She covered it with soft [soil,paper,juice].","Every morning, Nora gave the seed some [water,chalk,bread].","After a few days, a green [sprout,blanket,sandwich] appeared.","The plant grew taller in the warm [sunlight,freezer,backpack].","Soon it had several wide [leaves,pencils,shoes] on its stem.","One morning, Nora noticed a bright yellow [flower,bicycle,window] near the top.","A busy bee landed on the [flower,pillow,bathtub].","Nora watched the bee collect [nectar,crayons,snow].","She was proud of the little garden she had [grown,eaten,carried]."]],
["The Friendly Fox",[
"Sam saw a small fox near the [forest,kitchen,classroom].","The fox had bright orange [fur,feathers,scales].","Sam stayed very [quiet,hungry,square] so he would not scare it.","The fox sniffed the air with its little [nose,shoe,tail].","Then it walked slowly toward a fallen [log,sandwich,pillow].","Sam noticed that one paw was [hurt,blue,loud].","He called his mom, who brought a kind animal [helper,sandwich,blanket].","The helper carefully checked the fox's [paw,pencil,window].","Soon the fox was ready to [walk,read,bake] again.","It disappeared safely into the [woods,bathtub,backpack]."]],
["The Big Soccer Game",[
"Ben wore his favorite [jersey,spoon,blanket] to the soccer game.","His team practiced passing the [ball,pencil,sandwich].","The coach told everyone to work [together,purple,yesterday].","Ben kicked the ball toward the [goal,ceiling,backpack].","His teammate Mia ran very [fast,sleepy,wooden] to catch it.","She passed the ball back with a strong [kick,whisper,pillow].","Ben took a shot and the ball went into the [net,kitchen,shoe].","The crowd began to [cheer,sleep,melt].","Both teams shook hands after the [game,breakfast,pencil].","Ben went home feeling proud of his [team,bathtub,carrot]."]],
["The Library Cat",[
"Emma visited the library to find a good [book,sandwich,shoe].","She noticed a fluffy cat sleeping on a [chair,pencil,cloud].","The cat opened one eye and looked at [Emma,Tuesday,purple].","Emma gently sat beside the [cat,bicycle,cookie].","The cat began to [purr,fly,swim] very softly.","Emma read her story while the cat stayed [nearby,square,yesterday].","After a while, the cat stretched and walked between the [shelves,pancakes,clouds].","Emma followed it to a quiet [corner,bathtub,sandwich].","There she found a book about [animals,spoons,raincoats].","Emma smiled because the library had given her a wonderful [surprise,carrot,pillow]."]],
["The Snowy Morning",[
"When Jack woke up, the ground was covered with [snow,juice,grass].","He looked outside and saw a white [yard,sandwich,pencil].","Jack pulled on his warm [coat,spoon,pillow].","He put on his boots and ran [outside,yesterday,purple].","Jack made a small [snowman,sandwich,bicycle] near the porch.","He gave the snowman a carrot for a [nose,shoe,window].","His sister helped make two round [eyes,cookies,books].","Then they built a tall snow [fort,banana,pencil].","They played until their fingers felt [cold,noisy,square].","Inside, Mom gave them warm [cocoa,crayons,grass] to drink."]],
["The Helpful Robot",[
"Ava built a small robot from a box and some [parts,cookies,clouds].","She gave the robot two round [eyes,sandwiches,shoes].","The robot could move its arms and [legs,pencils,windows].","Ava pressed a button on its [back,banana,blanket].","The robot began to [walk,sleep,swim] across the room.","It picked up a toy and put it in the [box,bathtub,tree].","Then it helped Ava clean the [floor,sky,sandwich].","Ava gave her robot a big [smile,pencil,winter] and a high five.","The robot beeped as if it were [happy,hungry,purple].","Ava decided to teach it another helpful [job,cloud,shoe]."]],
["A Day at the Beach",[
"Lily and her family went to the [beach,library,kitchen] on Saturday.","Lily carried a yellow [bucket,pillow,pencil] to the sand.","She filled it with wet [sand,juice,socks].","Her brother built a tall [castle,sandwich,bicycle] nearby.","The waves rolled gently toward the [shore,ceiling,backpack].","Lily found a pretty [shell,spoon,mitten] beside the water.","She held it close and listened to the soft [sound,carrot,blanket].","A seagull flew high above the [ocean,bedroom,table].","After lunch, everyone walked along the [sand,roof,pencil].","Lily said the beach was a wonderful place to [explore,sleep,bake]."]],
["The Little Seedling",[
"Eli found a tiny plant growing beside the [fence,pillow,spoon].","Its green leaves were very [small,noisy,wooden].","Eli wondered how the plant had gotten [there,breakfast,purple].","He looked around and saw many [seeds,shoes,windows] on the ground.","A bird had probably carried one [here,blue,loudly].","Eli decided to give the seedling some [water,crayons,socks].","He used a small cup to pour it [carefully,yesterday,square].","The next week, the plant had grown [taller,colder,quieter].","Eli was excited to see its first little [flower,shoe,pencil].","He knew he would keep taking care of it as it [grew,ate,jumped]."]]
];
const $=id=>document.getElementById(id);let story,done,correct;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(i){story=S[i];done=0;correct=0;$('select').classList.add('hidden');$('results').classList.add('hidden');$('practice').classList.remove('hidden');$('title').textContent=story[0];$('progress').textContent='Choose one answer for each sentence.';$('scoreArea').innerHTML='';render();scrollTo(0,0)}
function render(){let q=$('questions');q.innerHTML='';story[1].forEach((raw,n)=>{let m=raw.match(/\[([^\]]+)\]/),c=m[1].split(','),ans=c[0],s=raw.replace(m[0],'_____'),w=document.createElement('div');w.className='question';w.innerHTML='<div class="sentence"><strong>'+(n+1)+'.</strong> '+esc(s)+'</div>';let opts=document.createElement('div');c=shuffle(c);c.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(b,x,ans,opts);opts.appendChild(b)});w.appendChild(opts);q.appendChild(w)})}
function answer(b,x,ans,opts){if(b.disabled)return;[...opts.children].forEach(z=>z.disabled=true);done++;[...opts.children].forEach(z=>{if(z.textContent===ans)z.classList.add('correct')});if(x===ans)correct++;else b.classList.add('incorrect');if(done===10){let b=document.createElement('button');b.id='scoreButton';b.textContent='See My Score';b.onclick=showScore;$('scoreArea').appendChild(b);b.scrollIntoView({behavior:'smooth',block:'center'})}}
function showScore(){let p=Math.round(correct/10*100);$('practice').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`You got ${correct} out of 10 correct — ${p}%.`;scrollTo(0,0)}
function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}
S.forEach((x,i)=>{let b=document.createElement('button');b.className='story-button';b.textContent=x[0];b.onclick=()=>start(i);$('stories').appendChild(b)});
$('back').onclick=()=>$('practice').classList.add('hidden')||$('select').classList.remove('hidden');$('again').onclick=()=>{$('results').classList.add('hidden');$('select').classList.remove('hidden');scrollTo(0,0)};
</script></body></html>
